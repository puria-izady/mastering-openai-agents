[project]
name = "text-stats"
version = "0.1.0"
requires-python = ">=3.11"
description = "Lab 00 reference solution: a tiny CLI for practicing Codex workflow."

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
text-stats = "text_stats.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

