[project]
name = "agents-sdk-sampler"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai-agents>=0.17.0", "pydantic>=2.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_sampler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

