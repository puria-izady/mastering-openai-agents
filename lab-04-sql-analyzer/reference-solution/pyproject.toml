[project]
name = "sql-analyzer-agent"
version = "0.1.0"
description = "Course lab reference solution: an OpenAI Agents SDK SQL analyzer over a local SQLite database."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.4.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
sql-analyzer = "sql_analyzer.app:main"
sql-analyzer-seed = "sql_analyzer.seed:main"
sql-analyzer-eval = "sql_analyzer.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
